<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Propose UI</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <!-- Sidebar -->
      <div class="sidebar">
        <div class="sidebar-header">
          <h1>Virtual Bulletin Board</h1>
        </div>
        <div class="sidebar-links">
          <ul>
            <li><a href="classroom.html">Classroom</a></li>
            <li><a href="#">Members</a></li>
            <li><a href="#">Settings</a></li>
            <li><a href="/login section/login.html">Log out</a></li>
          </ul>
        </div>
      </div>

      <!-- Main Content Area -->
      <div class="main-content">
        <div class="header">
          <h2>General Forum</h2>
        </div>

        <div class="message-area">
          <div class="message">
            <p><strong>User1:</strong> Hello, Wold</p>
          </div>
          <div class="message">
            <p><strong>User2:</strong> World*</p>
          </div>
        </div>

        <div class="message-input">
          <input type="text" placeholder="Type your message..." />
          <button>Send</button>
        </div>
      </div>
    </div>
  </body>
</html>
